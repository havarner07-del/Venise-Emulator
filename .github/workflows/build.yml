name: Build Venise

on:
  push:
    branches: ["**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx neu update
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: Venise
          path: Venise/
          if-no-files-found: error
